name: Play closed-test AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate signing secrets
        env:
          ACT_UPLOAD_KEYSTORE_B64: ${{ secrets.ACT_UPLOAD_KEYSTORE_B64 }}
          ACT_UPLOAD_STORE_PASSWORD: ${{ secrets.ACT_UPLOAD_STORE_PASSWORD }}
          ACT_UPLOAD_KEY_ALIAS: ${{ secrets.ACT_UPLOAD_KEY_ALIAS }}
          ACT_UPLOAD_KEY_PASSWORD: ${{ secrets.ACT_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$ACT_UPLOAD_KEYSTORE_B64" || -z "$ACT_UPLOAD_STORE_PASSWORD" || -z "$ACT_UPLOAD_KEY_ALIAS" || -z "$ACT_UPLOAD_KEY_PASSWORD" ]]; then
            echo '::error::Configure all four ACT_UPLOAD_* signing secrets before running.'
            exit 1
          fi
      - name: Run unit tests and build AAB
        run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease
      - name: Sign AAB using permanent upload key
        env:
          ACT_UPLOAD_KEYSTORE_B64: ${{ secrets.ACT_UPLOAD_KEYSTORE_B64 }}
          ACT_UPLOAD_STORE_PASSWORD: ${{ secrets.ACT_UPLOAD_STORE_PASSWORD }}
          ACT_UPLOAD_KEY_ALIAS: ${{ secrets.ACT_UPLOAD_KEY_ALIAS }}
          ACT_UPLOAD_KEY_PASSWORD: ${{ secrets.ACT_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upload-key"
          printf '%s' "$ACT_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-key/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload-key/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload-key/upload.jks" \
            -storepass:env ACT_UPLOAD_STORE_PASSWORD \
            -keypass:env ACT_UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$RUNNER_TEMP/AppCycleTester-play-upload.aab" \
            app/build/outputs/bundle/release/app-release.aab "$ACT_UPLOAD_KEY_ALIAS"
          jarsigner -verify -verbose "$RUNNER_TEMP/AppCycleTester-play-upload.aab" > "$RUNNER_TEMP/verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/verify.txt"
      - name: Save Play upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AppCycleTester-play-upload-aab
          path: ${{ runner.temp }}/AppCycleTester-play-upload.aab
          retention-days: 7
          if-no-files-found: error
