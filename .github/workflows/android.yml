name: Sequmio Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEQ_GOOGLE_WEB_CLIENT_ID: ${{ vars.SEQ_GOOGLE_WEB_CLIENT_ID }}
      SEQ_FIREBASE_API_KEY: ${{ vars.SEQ_FIREBASE_API_KEY }}
      SEQ_FIREBASE_APP_ID: ${{ vars.SEQ_FIREBASE_APP_ID }}
      SEQ_FIREBASE_PROJECT_ID: ${{ vars.SEQ_FIREBASE_PROJECT_ID }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate Cloud Functions JavaScript
        run: node --check functions/index.js
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Sequmio-release-unsigned-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Sequmio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
